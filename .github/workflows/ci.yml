name: Build the CI job for nodejs application

on:
  push:
    branches:
      - ci-cd-branch
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Recommended to use an active LTS version
          cache: 'npm'       # Caching dependencies speeds up future runs

      - name: Install dependencies
        run: npm ci          # 'npm ci' is cleaner for CI environments than 'install'

      - name: Run tests
        run: npm test

      - name: List files
        run: ls -R

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-app-artifacts
          # Adjust 'path' to your specific build folder if you have one (e.g., ./dist)
          path: ./ 
          retention-days: 5
