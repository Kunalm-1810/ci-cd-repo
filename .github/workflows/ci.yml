name: Build the CI job for nodejs application

on:
  push:
    branches:
      - ci-cd-branch
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated to latest version

      - name: Set up Node.js
        uses: actions/setup-node@v4 # Updated to latest version
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: List build directory
        run: ls -R # -R shows subdirectories too

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-app-artifacts
          path: ./

      - name: Display Secrets and Variables
        run: |
          echo "Username: ${{ vars.USER_NAME }}"
          echo "Password: ${{ secrets.PASSWORD }}" 
